# ── Agent settings (ARCHITECT_DECISIONS §3–7) ───────────────────────────
[agent]
auto_spawn_daemon = true
mcp_auto_register = false
default_scope     = "read-only"
require_confirm   = false
audit_log_path    = "~/.config/lazyhub/audit.log"

[daemon]
idle_timeout_minutes = 30
socket_path          = "~/.config/lazyhub/daemon.sock"
pid_file             = "~/.config/lazyhub/daemon.pid"

# ── Built-in permission scopes (ARCHITECT_DECISIONS §7) ─────────────────
# Override or extend by adding your own [scopes.<name>] blocks in your config.
[scopes.full]
allow_reads     = true
allow_writes    = true
allow_approvals = true
allow_merges    = true
allow_comments  = true

[scopes.read-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = false

[scopes.review-only]
allow_reads     = true
allow_writes    = false
allow_approvals = true
allow_merges    = false
allow_comments  = true

[scopes.comment-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = true

[scopes.no-merge]
allow_reads     = true
allow_writes    = true
allow_approvals = true
allow_merges    = false
allow_comments  = true

[scopes.triage-only]
allow_reads     = true
allow_writes    = false
allow_approvals = false
allow_merges    = false
allow_comments  = true

# ── AI budget (Phase L8 #153 enforces; schema slot reserved in V1) ───────
[ai]
provider          = "anthropic"
model             = ""
anthropic_api_key = ""
openai_api_key    = ""
openai_base_url   = "https://api.openai.com/v1"

[ai.openai_compatible]
# Ollama: http://localhost:11434/v1
# LM Studio: http://localhost:1234/v1
# Groq: https://api.groq.com/openai/v1
# OpenRouter: https://openrouter.ai/api/v1
# vLLM: http://your-vllm-host:8000/v1
base_url   = "http://localhost:11434/v1"
api_key    = ""
model      = "qwen2.5-coder:32b"
timeout_ms = 60000

[ai.second_opinion]
enabled = true

[ai.second_opinion.map]
copilot = "anthropic-api"
claude  = "codex"
codex   = "anthropic-api"
gemini  = "anthropic-api"

[ai.budget]
monthly_usd_cap  = 0     # 0 = unlimited
per_call_usd_cap = 0     # 0 = unlimited
on_cap_exceeded  = "warn"  # warn | block

# ── Auto-managed runtime state (Phase E2 #131) ───────────────────────────
[state]
